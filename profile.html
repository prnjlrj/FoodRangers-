<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="custom-header d-flex align-items-center px-3 py-2">
        <i class="fas fa-user-circle fa-2x text-white me-3"></i>
        <h1 class="m-0 fw-bold text-black">User Info</h1>
    </header>
    <div class="container mt-4">
        <div class="card p-4 shadow-lg rounded">

            <div class="mb-3">
                <label class="form-label fw-bold">Name</label>
                <input type="text" class="form-control form-control-lg" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" class="form-control form-control-lg" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Phone Number</label>
                <input type="tel" class="form-control form-control-lg" placeholder="Enter phone number">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Address</label>
                <input type="text" class="form-control form-control-lg" placeholder="Enter your address">
            </div>
            <div class="mt-2">
                <a href="#" class="text-decoration-none fw-bold" style="color:#ff6a00;">
                    <i class="fas fa-plus"></i> Add more address
                </a>
            </div>

        </div>
    </div>

</body>
</html>
