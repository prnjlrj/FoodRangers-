<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Rangers</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hp.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <img src="poor.jpg" alt="logo">
            <span>FoodRangers</span>
        </div>
        <div class="menu-btn">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">

        <div class="tagline">CONNECT. SHARE. FEED.</div>

        <h1>
            Share Leftovers.<br>
            <span class="highlight">Feed Someone<br>In Need.</span>
        </h1>

        <p class="subtitle">
            Connect surplus food from restaurants and households with volunteer drivers
            to deliver meals to those who need them most.
        </p>

        <div class="hero-buttons">
            <button class="btn-primary">DONATE/RECIEVE FOOD</button>
            <button class="btn-outline">REGISTER AS DRIVER</button>
        </div>
    </section>

    <!-- STATS SECTION -->
    <section class="stats">
        <div class="stat-card">
            <h2>2k+</h2>
            <p>MEALS DONATED</p>
        </div>
        <div class="stat-card">
            <h2 class="orange">50+</h2>
            <p>ACTIVE DRIVERS</p>
        </div>
        <div class="stat-card">
            <h2>20</h2>
            <p>CITIES SERVED</p>
        </div>
        
    </section>

<script src="script.js"></script>
</body>
</html>
