<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Create Account</h2>
            <form id="signupForm" action="/signup" method="POST">
                <fieldset>
                    <legend>Account Type</legend>
                    <label>
                        <input type="radio" name="accountType" value="individual" checked>
                        Individual
                    </label>
                    <label>
                        <input type="radio" name="accountType" value="organisation">
                        Organisation
                    </label>
                </fieldset>

                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required minlength="6">
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required minlength="6">
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="login.html">Login</a></p>
            <div id="message"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
