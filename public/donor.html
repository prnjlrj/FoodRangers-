<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Section</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary-orange: #ff6a00;
            --dark-bg: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 106, 0, 0.3);
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #2d1b14 50%, var(--dark-bg) 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .donor-container {
            min-height: 100vh;
            padding: 80px 20px 40px;
            display: flex;
            align-items: center;
        }

        .donor-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .donor-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-orange), #ff8c42, var(--primary-orange));
        }

        .section-title {
            background: linear-gradient(135deg, var(--primary-orange), #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-orange), #ff8c42);
            border-radius: 2px;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .form-control, .form-select, .form-range {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus, .form-select:focus, .form-range:focus {
            border-color: var(--primary-orange);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 4px rgba(255, 106, 0, 0.2);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .quantity-group {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 200px;
        }

        .quantity-btn {
            background: var(--primary-orange);
            border: none;
            color: #000;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .quantity-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 106, 0, 0.4);
        }

        .option-group {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .form-check-input {
            transform: scale(1.3);
            accent-color: var(--primary-orange);
            filter: drop-shadow(0 0 4px rgba(255, 106, 0, 0.5));
        }

        .form-check-label {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .form-check-input:checked + .form-check-label {
            color: var(--primary-orange);
        }

        .slider-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .slider-value {
            color: var(--primary-orange);
            font-weight: 700;
            font-size: 24px;
        }

        .donate-btn {
            background: linear-gradient(135deg, var(--primary-orange) 0%, #ff8c42 100%);
            color: #000;
            border: none;
            font-weight: 800;
            padding: 20px 50px;
            border-radius: 25px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 15px 40px rgba(255, 106, 0, 0.4);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .donate-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(255, 106, 0, 0.5);
            color: #000;
        }

        .donate-btn:active {
            transform: translateY(-2px);
        }

        .add-item-link {
            color: var(--primary-orange);
            font-weight: 600;
            padding: 12px 20px;
            border: 2px dashed var(--primary-orange);
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .add-item-link:hover {
            background: rgba(255, 106, 0, 0.1);
            border-style: solid;
            transform: translateY(-2px);
        }

        .no-address {
            background: rgba(220, 53, 69, 0.2);
            border: 2px dashed rgba(220, 53, 69, 0.5);
            color: #f8d7da;
        }

        @media (max-width: 768px) {
            .donor-container {
                padding: 60px 15px 30px;
            }
            .donor-card {
                padding: 30px 25px;
                margin: 0 10px;
            }
            .section-title {
                font-size: 1.6rem;
            }
        }
        .form-select {
    background: rgba(255, 255, 255, 0.12) !important;
    border: 2px solid var(--glass-border) !important;
    border-radius: 15px !important;
    color: #ffffff !important;
    padding: 15px 20px !important;
    font-size: 16px !important;
    transition: all 0.3s ease !important;
    backdrop-filter: blur(10px) !important;
    background-image: none !important; /* Remove default dropdown arrow */
}

.form-select::placeholder {
    color: rgba(255, 255, 255, 0.6) !important;
}

.form-select:focus {
    border-color: var(--primary-orange) !important;
    background: rgba(255, 255, 255, 0.18) !important;
    box-shadow: 0 0 0 4px rgba(255, 106, 0, 0.2), 0 0 20px rgba(255, 106, 0, 0.3) !important;
    color: #ffffff !important;
    transform: translateY(-1px) !important;
    outline: none !important;
}

/* Custom dropdown arrow */
.form-select {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ff6a00' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
    background-position: right 15px center !important;
    background-repeat: no-repeat !important;
    background-size: 18px !important;
    padding-right: 50px !important;
}

/* Option styling */
.form-select option {
    background: #1a1a1a !important;
    color: #ffffff !important;
    padding: 10px !important;
}

.form-select option:hover,
.form-select option:focus,
.form-select option:checked {
    background: var(--primary-orange) !important;
    color: #000 !important;
}

/* No address option styling */
.no-address {
    background: rgba(220, 53, 69, 0.2) !important;
    border: 2px dashed rgba(220, 53, 69, 0.5) !important;
    color: #f8d7da !important;
}

.no-address option {
    color: #f8d7da !important;
}
.back-btn {
    position: absolute;
    top: 20px;
    left: 25px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 106, 0, 0.3);
    color: rgba(255, 255, 255, 0.9);
    padding: 10px 15px;
    border-radius: 15px;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s ease;
    z-index: 10;
    text-decoration: none;
}

.back-btn:hover {
    background: rgba(255, 106, 0, 0.2);
    border-color: #ff6a00;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 106, 0, 0.3);
}

@media (max-width: 768px) {
    .back-btn {
        top: 15px;
        left: 15px;
        padding: 8px 12px;
        font-size: 13px;
    }
}


    </style>
</head>
<body>
    <div class="donor-container">
                    <a href="dashboard.html" class="back-btn" title="Go back to Dashboard">
    <i class="fas fa-arrow-left me-1"></i>Back
</a>
        <div class="card donor-card">
            <h2 class="section-title">
                <i class="fas fa-hand-holding-heart me-3"></i>
                Donate Food
            </h2>
            <!-- Location -->
            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-map-marker-alt me-2 text-warning"></i>
                    Pickup Location
                </label>
                <select class="form-select form-select-lg" id="locationSelect">
                    <option value="">Loading addresses...</option>
                </select>
<small class="text-light mt-1 d-block fw-medium" style="color: rgba(255, 255, 255, 0.8); font-size: 14px;">
    <i class="fas fa-info-circle me-1"></i>
    Select from your saved addresses
</small>
            </div>

            <!-- Food Description -->
            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-utensils me-2 text-info"></i>
                    Food Description
                </label>
                <textarea class="form-control" id="foodDesc" rows="3" 
                    placeholder="e.g., 10kg rice bags, fresh vegetables, 20 cooked meals, bread loaves..."></textarea>
            </div>

            <!-- Quantity -->
            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-hashtag me-2 text-primary"></i>
                    Quantity
                </label>
                <div class="quantity-group">
                    <button class="quantity-btn" id="minusBtn">−</button>
                    <input type="text" id="quantityInput" class="form-control text-center px-3" 
                        value="1" readonly style="border: none; background: transparent; font-size: 20px; font-weight: 700;">
                    <button class="quantity-btn" id="plusBtn">+</button>
                </div>
            </div>

            <!-- Add More Items -->
            <div class="mb-4">
                <a href="#" class="add-item-link" onclick="addFoodItem(event)">
                    <i class="fas fa-plus-circle"></i>
                    Add more food items
                </a>
            </div>

            <!-- Containers -->
            <div class="option-group mb-4">
                <label class="form-label mb-3">
                    <i class="fas fa-box me-2 text-success"></i>
                    Food Containers Available?
                </label>
                <div class="d-flex gap-4 justify-content-center">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="containers" id="yesContainer" value="yes">
                        <label class="form-check-label" for="yesContainer">
                            <i class="fas fa-check-circle text-success me-1"></i>Yes
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="containers" id="noContainer" value="no">
                        <label class="form-check-label" for="noContainer">
                            <i class="fas fa-times-circle text-danger me-1"></i>No
                        </label>
                    </div>
                </div>
            </div>

            <!-- Food Type -->
            <div class="option-group mb-4">
                <label class="form-label mb-3">
                    <i class="fas fa-seedling me-2 text-success"></i>
                    Food Type
                </label>
                <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="foodType" id="veg" value="veg">
                        <label class="form-check-label" for="veg">
                            <i class="fas fa-leaf text-success me-1"></i>Veg
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="foodType" id="nonveg" value="nonveg">
                        <label class="form-check-label" for="nonveg">
                            <i class="fas fa-drumstick-bite text-danger me-1"></i>Non-Veg
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="foodType" id="jain" value="jain">
                        <label class="form-check-label" for="jain">
                            <i class="fas fa-pray text-warning me-1"></i>Jain
                        </label>
                    </div>
                </div>
            </div>

            <!-- Prep Time -->
            <div class="slider-container">
                <label class="form-label mb-3">
                    <i class="fas fa-clock me-2 text-info"></i>
                    Preparation Time
                </label>
                <input type="range" class="form-range" id="prepTimeRange" min="0" max="7" value="0">
                <div class="d-flex justify-content-between mt-3">
                    <small class="text-muted">Just now</small>
                    <span class="slider-value" id="prepHours">0</span>
                    <small class="text-muted">7+ hrs</small>
                </div>
            </div>

            <!-- Donate Button -->
            <div class="text-center">
                <button class="donate-btn" onclick="submitDonation()">
                    <i class="fas fa-paper-plane me-2"></i>
                    Donate Now
                </button>
            </div>

            <div id="message" class="mt-4"></div>
        </div>
    </div>

    <script>
        let foodItems = [{ desc: '', qty: 1 }];
        let userAddresses = [];

        // Load addresses from localStorage
        function loadUserAddresses() {
            const userInfo = JSON.parse(localStorage.getItem('userInfo'));
            if (!userInfo || !userInfo.addresses || userInfo.addresses.length === 0) {
                const select = document.getElementById('locationSelect');
                select.innerHTML = '<option value="" class="no-address">➕ Add address in Profile first</option>';
                select.classList.add('no-address');
                return;
            }

            userAddresses = userInfo.addresses.filter(addr => addr.trim());
            const select = document.getElementById('locationSelect');
            
            select.innerHTML = '<option value="">Select pickup location</option>';
            userAddresses.forEach((address) => {
                const option = document.createElement('option');
                option.value = address;
                option.textContent = address.length > 50 ? address.substring(0, 50) + '...' : address;
                select.appendChild(option);
            });
            select.classList.remove('no-address');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadUserAddresses();
            
            // Check login
            const userInfo = JSON.parse(localStorage.getItem('userInfo'));
            if (!userInfo) {
                window.location.href = '/';
                return;
            }

            // Quantity controls
            document.getElementById('minusBtn').onclick = () => {
                let value = parseInt(document.getElementById('quantityInput').value);
                if (value > 1) document.getElementById('quantityInput').value = value - 1;
            };
            
            document.getElementById('plusBtn').onclick = () => {
                let value = parseInt(document.getElementById('quantityInput').value);
                document.getElementById('quantityInput').value = value + 1;
            };

            // Prep time slider
            document.getElementById('prepTimeRange').oninput = function() {
                document.getElementById('prepHours').textContent = this.value;
            };
        });

        function addFoodItem(e) {
            e.preventDefault();
            showMessage('Multiple items feature coming soon! 🚀', 'info');
        }

        async function submitDonation() {
            const userInfo = JSON.parse(localStorage.getItem('userInfo'));
            const formData = {
                userId: userInfo.id,
                location: document.getElementById('locationSelect').value,
                foodDesc: document.getElementById('foodDesc').value,
                quantity: document.getElementById('quantityInput').value,
                containers: document.querySelector('input[name="containers"]:checked')?.value || 'no',
                foodType: document.querySelector('input[name="foodType"]:checked')?.value || '',
                prepHours: document.getElementById('prepTimeRange').value
            };

            if (!formData.location || !formData.foodDesc || !formData.foodType) {
                showMessage('Please fill all required fields! ⚠️', 'warning');
                return;
            }

            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Submitting...';
            btn.disabled = true;

            try {
                // TODO: POST to /api/donations
                console.log('Donation data:', formData);
                showMessage('Donation submitted successfully! 🎉 Thank you for your generosity!', 'success');
                setTimeout(() => window.location.reload(), 2500);
            } catch (error) {
                showMessage('Submission failed. Please try again! ❌', 'danger');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showMessage(text, type = 'info') {
            const messageDiv = document.getElementById('message');
            const bgClass = type === 'success' ? 'bg-success' : 
                           type === 'danger' ? 'bg-danger' : 
                           type === 'warning' ? 'bg-warning' : 'bg-info';
            
            messageDiv.innerHTML = `<div class="alert alert-${bgClass} shadow-lg border-0 fade show" role="alert">
                ${text}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
            </div>`;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
