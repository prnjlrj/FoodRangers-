<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b14 50%, #1a1a1a 100%);
            min-height: 100vh;
            color: #ffffff;
        }

        /* Profile Bar - Black Header */
        .profile-bar {
            background: #000000;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(255, 106, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .profile-bar .container {
            max-width: 1200px;
        }

        .options {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
        }

        .options a {
            color: #ff6a00;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 10px 20px;
            border: 2px solid #ff6a00;
            border-radius: 25px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options a:hover {
            background: #ff6a00;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.4);
        }

        /* Dashboard Cards */
        .dashboard-grid {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 106, 0, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.4s ease;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6a00, #ff8c42, #ff6a00);
        }

        .dashboard-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px rgba(255, 106, 0, 0.2);
            border-color: #ff6a00;
        }

        .dashboard-card i {
            font-size: 4rem;
            color: #ff6a00;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255, 106, 0, 0.5));
        }

        .dashboard-card h3 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ff6a00, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .dashboard-card p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .dashboard-btn {
            background: linear-gradient(135deg, #ff6a00, #ff8c42);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.3);
        }

        .dashboard-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 106, 0, 0.4);
            color: #000;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-card {
                margin-bottom: 30px;
                height: 280px;
                padding: 30px 20px;
            }
            
            .dashboard-card h3 {
                font-size: 1.5rem;
            }
            
            .options {
                flex-direction: column;
                gap: 10px;
            }
        }

        /* Logout Button */
        .logout-btn {
            background: #dc3545;
            color: white;
            border: 2px solid #dc3545;
        }

        .logout-btn:hover {
            background: transparent;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <!-- Profile Bar -->
    <div class="profile-bar">
        <div class="container">
            <div class="options">
                <a href="profile.html">
                    <i class="fas fa-user"></i> Profile
                </a>
                <a href="#" onclick="logout()" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div class="dashboard-grid">
        <div class="row g-4">
            <!-- Donor Card -->
            <div class="col-lg-6 col-md-6">
                <a href="donor.html" class="text-decoration-none">
                    <div class="dashboard-card">
                        <i class="fas fa-box-open"></i>
                        <h3>Donate Food</h3>
                        <p>Share your excess food with those in need. Every plate counts!</p>
                        <button class="btn dashboard-btn">
                            Start Donating <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </a>
            </div>

            <!-- Receiver Card -->
            <div class="col-lg-6 col-md-6">
                <a href="receiver.html" class="text-decoration-none">
                    <div class="dashboard-card">
                        <i class="fas fa-hands-helping"></i>
                        <h3>Receive Food</h3>
                        <p>Order nutritious meals at affordable prices from verified donors.</p>
                        <button class="btn dashboard-btn">
                            Order Now <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('userInfo');
                window.location.href = '/';
            }
        }

        // Check login status
        document.addEventListener('DOMContentLoaded', function() {
            const userInfo = JSON.parse(localStorage.getItem('userInfo'));
            if (!userInfo) {
                window.location.href = '/';
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
